<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Dashboard | RD Share</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/user.css"><link rel="stylesheet" href="../assets/css/dashboard.css"></head><body>
<main class="page-container dashboard-shell"><header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><h1 class="page-title">RD Share — My Files</h1><button class="btn btn-outline-info" onclick="logout()">Logout</button></header>
<nav class="nav nav-pills dashboard-nav mb-4"><button class="nav-link active" data-view="overview">Overview</button><button class="nav-link" data-view="files">My Files</button><button class="nav-link" data-view="folders">Folders</button></nav>
<section id="view-overview" class="view-section"><div class="row g-3"><div class="col-md-6"><div class="stat-card"><span>My files</span><strong id="myFileCount">0</strong></div></div><div class="col-md-6"><div class="stat-card"><span>Account</span><strong>Active</strong></div></div></div><div class="content-card mt-3"><h3>Welcome back, rishit</h3><p>Upload and organize your files.</p></div></section>
<section id="view-files" class="view-section" hidden><div class="content-card"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3"><h3>My files</h3><label class="btn btn-primary mb-0">Upload files<input id="fileUpload" type="file" multiple hidden></label></div><input id="fileSearch" class="form-control mb-3" placeholder="Search files"><div id="clientFiles"></div></div></section>
<section id="view-folders" class="view-section" hidden><div class="content-card"><h3>Folders</h3><form id="folderForm" class="d-flex gap-2 my-3"><input id="folderName" class="form-control" placeholder="New folder name" required><button class="btn btn-primary">Create</button></form><div id="folderList"></div></div></section>
</main><script src="../assets/js/app.js"></script></body></html>
