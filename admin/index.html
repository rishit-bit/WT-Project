<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | RD Share</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@600&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/admin.css"><link rel="stylesheet" href="../assets/css/dashboard.css"></head><body>
<main class="page-container dashboard-shell"><header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><h1 class="page-title">RD Share — Admin</h1><button class="btn btn-outline-info" onclick="logout()">Logout</button></header>
<nav class="nav nav-pills dashboard-nav mb-4"><button class="nav-link active" data-view="overview">Overview</button><button class="nav-link" data-view="users">Users</button><button class="nav-link" data-view="files">All Files</button></nav>
<section id="view-overview" class="view-section"><div class="row g-3"><div class="col-md-4"><div class="stat-card"><span>Total users</span><strong id="totalUsers">2</strong></div></div><div class="col-md-4"><div class="stat-card"><span>Total files</span><strong id="totalFiles">0</strong></div></div><div class="col-md-4"><div class="stat-card"><span>Status</span><strong>Online</strong></div></div></div><div class="content-card mt-3"><h3>Welcome, Administrator</h3><p>Manage accounts and review files uploaded by the client.</p></div></section>
<section id="view-users" class="view-section" hidden><div class="content-card"><h3>Users</h3><div class="table-responsive"><table class="table table-dark table-hover"><thead><tr><th>Username</th><th>Role</th></tr></thead><tbody id="usersTable"></tbody></table></div></div></section>
<section id="view-files" class="view-section" hidden><div class="content-card"><h3>All files</h3><input id="adminSearch" class="form-control mb-3" placeholder="Search files"><div id="adminFiles"></div></div></section>
</main><script src="../assets/js/app.js"></script></body></html>
