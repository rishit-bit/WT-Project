<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | RD Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div id="canvas-container"></div>
<div class="login-container">
<h1 class="logo">RD Share</h1>
<div id="error-message" class="error-message" style="display:none"></div>
<form id="loginForm">
<div class="input-group"><input id="username" type="text" name="username" placeholder="Username" autocomplete="username" required></div>
<div class="input-group"><input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required></div>
<button type="submit" class="login-btn">Login</button>
</form>
</div>
<script src="assets/js/app.js"></script>
</body></html>
